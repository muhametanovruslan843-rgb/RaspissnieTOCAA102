<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание ТОСАА102</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0f3d24;--bg2:#145230;--card:rgba(255,255,255,.9);--tx:#12301f;--mut:#4d6b58;--acc:#f4c430;--accd:#c79a00;--line:rgba(244,196,48,.45)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 200px);scroll-behavior:smooth}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--tx);font-family:"Manrope","Segoe UI",system-ui,sans-serif;min-height:100%}
.wm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0}
.wm img{width:min(92vw,560px);height:auto;opacity:.14}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;flex-direction:column;align-items:flex-start;gap:8px;color:#fff}
.top img{height:56px;width:auto;flex:none}
.top small{display:block;color:var(--acc);font-size:13px}
.top b{font-size:34px;font-weight:800;line-height:1.1}
.week{display:flex;align-items:center;justify-content:space-between;margin:16px 0 12px;background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:20px;padding:10px;color:#fff}
.week button{background:var(--acc);color:#12301f;border:0;border-radius:14px;font-size:26px;font-weight:700;width:46px;height:46px;cursor:pointer}
.week button:disabled{opacity:.35}
.week div{text-align:center;font-size:20px;font-weight:800}
.week small{display:block;color:var(--acc);font-size:14px;font-weight:600}
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px 0;margin:0 -16px;padding-left:16px;padding-right:16px;background:linear-gradient(var(--bg),rgba(15,61,36,.92))}
.prog{display:flex;align-items:center;gap:10px;color:#dfeee4;font-size:13px;margin-bottom:8px}
.bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.days a{display:flex;align-items:center;justify-content:center;height:46px;border-radius:14px;border:1px solid var(--line);color:#fff;text-decoration:none;font-weight:700}
.days a.on{background:var(--acc);color:#12301f;border-color:var(--acc)}
.days a.today:not(.on){border-style:dashed;border-color:var(--acc)}
section{padding-top:8px}
section h2{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 10px;color:#fff;font-size:22px}
section h2 span{color:var(--acc);font-size:15px;font-weight:600}
.pair{display:flex;gap:14px;background:var(--card);border-left:6px solid var(--acc);border-radius:18px;padding:14px;margin-bottom:10px}
.time{min-width:74px;text-align:center;border-radius:12px;background:#e6f2e9;padding:8px 4px;font-weight:800;line-height:1.6}
.time span{display:block;color:var(--mut);font-weight:500}
.info h3{margin:2px 0 4px;font-size:18px}.info p{margin:0;color:var(--mut);font-size:15px}
.room{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:10px;background:var(--acc);font-size:14px;font-weight:700}
.tag{display:inline-block;margin:8px 0 0 6px;padding:2px 10px;border-radius:10px;border:1px solid var(--accd);color:#7a5c00;font-size:13px}
.pair.past{background:rgba(255,255,255,.55);border-left-color:#8aa596}
.pair.past h3,.pair.past p,.pair.past .time{text-decoration:line-through;text-decoration-thickness:2px;color:#5f7567}
.pair.now{box-shadow:0 0 0 3px var(--acc)}
.empty{color:#dfeee4;text-align:center;padding:20px 0;border:1px dashed var(--line);border-radius:16px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<!-- Водяной знак: вставьте настоящий логотип в LOGO_SRC (см. настройки в скрипте) -->
<div class="wm" id="wm"></div>
<main>
  <div class="top"><span id="logoTop"></span><div><small id="meta"></small><b id="title"></b></div></div>
  <div class="week"><button id="prev" aria-label="Предыдущая неделя">‹</button><div id="wk"></div><button id="next" aria-label="Следующая неделя">›</button></div>
  <div class="stick">
    <div class="prog"><div class="bar"><i id="fill" style="width:0"></i></div><span id="cnt"></span></div>
    <nav class="days" id="days"></nav>
  </div>
  <div id="list"></div>
</main>

// d: 1=ПН … 6=СБ; w: недели ("2-13", "1,2", "3-15н" = только нечётные, "2-16ч" = только чётные)
const T={a:["08:30","10:05"],b:["10:20","11:55"],c:["12:55","14:30"],d:["14:45","16:20"],s:["12:10","13:45"]};
const P=(d,t,title,teacher,room,w)=>({day:d,from:T[t][0],to:T[t][1],title,teacher,room,w});
const V="вакансия",ROZ="преп. Роженцева Г.Ф.",GER="преп. Герцева Н.В.",ADO="преп. Адова О.Л.",SHU="доц. Шуткова С.А.",VOR="преп. Ворожцова Ю.В.",ZIN="преп. Зинатуллина А.А.",AZN="доц. Азнабаева А.Ф.";
const LESSONS = [
 P(1,"a","МАТЕМАТИКА",V,"513/2","2-13"),
 P(1,"b","ИСТОРИЯ",ROZ,"513/2","2-14"),
 P(2,"a","МАТЕМАТИКА",V,"513/2","2-17"),
 P(2,"b","Кураторский час","","513/2","1-17"),
 P(2,"c","Математика",V,"503/2","2-17"),
 P(2,"d","Иностранный язык",AZN,"505/2","2-17"),
 P(3,"a","БИОЛОГИЯ",GER,"513/2","1-9"),
 P(3,"a","Биология",GER,"515/2","12,14"),
 P(3,"b","ФИЗИЧЕСКАЯ КУЛЬТУРА",ADO,"513/2","1"),
 P(3,"b","Биология",GER,"515/2","2-16ч"),
 P(3,"b","Математика",V,"503/2","3-11н"),
 P(3,"c","Математика",V,"512/2","2-17"),
 P(3,"d","Физика",SHU,"503/2","2-17"),
 P(4,"a","ФИЗИКА",SHU,"513/2","1-16"),
 P(4,"b","РУССКИЙ ЯЗЫК",VOR,"513/2","1-15н"),
 P(4,"b","ЛИТЕРАТУРА",VOR,"513/2","2-16ч"),
 P(4,"c","Физическая культура",ADO,"с/зал","1-16"),
 P(4,"d","Русский язык",VOR,"504/2","3-15н"),
 P(4,"d","Литература",VOR,"504/2","2-16ч"),

 P(6,"b","Физическая культура",ADO,"с/зал","1,2"),

 P(6,"b","Литература",VOR,"504/2","10"),
 P(6,"s","История",ROZ,"513/2","2-16")
];
function onWeek(spec,wk){
  const par=/[нч]$/.test(spec)?spec.slice(-1):"";
  if(par==="н"&&wk%2===0)return false; if(par==="ч"&&wk%2===1)return false;
  return spec.replace(/[нч]$/,"").split(",").some(p=>{const[a,b]=p.split("-").map(Number);return b?wk>=a&&wk<=b:wk===a});
}
const wkLabel=s=>(/н$/.test(s)?"н/н · ":/ч$/.test(s)?"ч/н · ":"")+"нед. "+s.replace(/[нч]$/,"").replace("-","–");
/* ====================== */

document.getElementById("wm").innerHTML=`<img src="${CONFIG.LOGO_BIG}" alt="">`;
document.getElementById("logoTop").innerHTML=`<img src="${CONFIG.LOGO_HEAD}" alt="Башкирский государственный аграрный университет">`;

const DN=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const MN=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const TABS=["ПН","ВТ","СР","ЧТ","ПТ","СБ"];
const start=new Date(CONFIG.semesterStart+"T00:00:00");
let now=new Date();
let week=Math.min(CONFIG.weeks,Math.max(1,Math.floor((now-start)/6048e5)+1));
const $=id=>document.getElementById(id);
const lessonsFor=(w,d)=>LESSONS.filter(l=>l.day===d&&onWeek(l.w,w)).sort((a,b)=>a.from.localeCompare(b.from));
const dateOf=(w,d)=>new Date(start.getTime()+((w-1)*7+d-1)*864e5);
const at=(date,hm)=>{const[h,m]=hm.split(":");const x=new Date(date);x.setHours(+h,+m,0,0);return x};

let day=(new Date().getDay()+6)%7+1; if(day>6)day=1;
function render(){
  now=new Date();
  $("meta").textContent=CONFIG.meta;$("title").textContent=CONFIG.group;
  $("wk").innerHTML=`Неделя ${week} / ${CONFIG.weeks}<small>${week%2?"нечётная (н/н)":"чётная (ч/н)"}</small>`;
  $("prev").disabled=week<=1;$("next").disabled=week>=CONFIG.weeks;
  let total=0,done=0,tabs="";
  for(let d=1;d<=6;d++){
    const dt=dateOf(week,d),isToday=dt.toDateString()===now.toDateString();
    lessonsFor(week,d).forEach(l=>{total++;if(at(dt,l.to)<now)done++});
    tabs+=`<a href="#" data-d="${d}" class="${d===day?"on":""} ${isToday?"today":""}">${TABS[d-1]}</a>`;
  }
  $("days").innerHTML=tabs;
  $("cnt").textContent=`${done}/${total} пар прошло`;
  $("fill").style.width=(total?done/total*100:0)+"%";
  const dt=dateOf(week,day),ls=lessonsFor(week,day);
  let html=`<section><h2>${DN[dt.getDay()]}<span>${dt.getDate()} ${MN[dt.getMonth()]}</span></h2>`;
  html+=ls.length?ls.map(l=>{
    const s=at(dt,l.from),e=at(dt,l.to),past=e<now,cur=s<=now&&now<=e;
    return `<div class="pair ${past?"past":""} ${cur?"now":""}"><div class="time">${l.from}<span>${l.to}</span></div>
    <div class="info"><h3>${l.title}</h3>${l.room?`<span class="room">${l.room}</span>`:""}</div></div>`}).join("")
    :`<div class="empty">Пар нет</div>`;
  $("list").innerHTML=html+"</section>";
}
$("days").onclick=e=>{const a=e.target.closest("a");if(!a)return;e.preventDefault();day=+a.dataset.d;render()};
$("prev").onclick=()=>{if(week>1){week--;render()}};
$("next").onclick=()=>{if(week<CONFIG.weeks){week++;render()}};
render();
setInterval(render,60000);
</script>
